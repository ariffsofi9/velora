name: velora
description: "AI smart-inventory."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cloud_firestore: ^6.0.3
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  http: ^1.2.2
  image_picker: ^1.2.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/velora_app_icon_final.png
  adaptive_icon_background: "#F8F7F2"
  adaptive_icon_foreground: assets/images/velora_app_icon_final.png
  adaptive_icon_foreground_inset: 30
  remove_alpha_ios: true
  background_color_ios: "#F8F7F2"
  web:
    generate: true
    image_path: assets/images/velora_app_icon_final.png
    background_color: "#F8F7F2"
    theme_color: "#526F52"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/velora_app_icon_final.png
    - assets/images/auth/
